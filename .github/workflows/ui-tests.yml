name: UI Tests (Playwright)

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'utils/**'
      - 'fixtures/**'
      - 'test-data/**'
      - 'global-setup.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'    # Monday 06:30 UTC, staggered after the API suite

jobs:
  playwright:
    name: Run OpenMRS UI suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The config pins `channel: 'chrome'`, so we need real Google Chrome,
      # not the bundled Chromium build.
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # global-setup.js launches headed on purpose — headless Chrome trips the
      # bot protection on test3.openmrs.org. xvfb gives the runner a virtual
      # display so headed Chrome works without a real monitor.
      - name: Run Playwright tests
        # test3.openmrs.org is a shared public demo server rebuilt around
        # release candidates. Same reasoning as the Newman job: always upload
        # the report so a red job can be inspected rather than guessed at.
        continue-on-error: true
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7

      # global-setup saves a screenshot here when login fails — the single most
      # useful artifact for telling "server is down" from "our selectors broke".
      - name: Upload global-setup failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-setup-failure
          path: .auth/setup-failure.png
          if-no-files-found: ignore
          retention-days: 7
